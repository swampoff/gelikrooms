name: GelikRooms demo checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API test dependencies
        run: python -m pip install -r server/requirements.txt pytest httpx
      - name: Test frontend
        run: |
          node tests/smoke.cjs
          node tests/advanced.cjs
      - name: Test payment adapter
        run: python -m pytest -q server/test_app.py